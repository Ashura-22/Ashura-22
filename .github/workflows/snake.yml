name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Ashura-22
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=34d399&color_dots=09090b,065f46,047857,059669,34d399
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=34d399&color_dots=09090b,065f46,047857,059669,34d399

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
